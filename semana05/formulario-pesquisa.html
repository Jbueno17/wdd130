<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário HTML - Pesquisa de Usuário</title>

    <link rel="stylesheet" href="formulario-pesquisa.css">
</head>

<body>

    <main>

        <h1>WDD 130 | Formulário HTML – Pesquisa de Usuário</h1>

        <form>

            <!-- INFORMAÇÕES DE CONTATO -->
            <fieldset>
                <legend>Informações de Contato</legend>

                <div class="campo">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome">
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email">
                </div>

            </fieldset>


            <!-- PERGUNTAS -->
            <fieldset>
                <legend>Perguntas</legend>

                <div class="pergunta">
                    <label for="navegador">
                        Qual é o seu navegador favorito?
                    </label>

                    <select id="navegador" name="navegador">
                        <option value="chrome">Chrome</option>
                        <option value="safari">Safari</option>
                        <option value="edge">Edge</option>
                        <option value="brave">Brave</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>


                <div class="pergunta checkbox">
                    <label for="animal">
                        Você tem um animal de estimação?
                    </label>

                    <input type="checkbox" id="animal" name="animal">
                </div>


                <div class="lugares">

                    <label for="lugares">
                        Liste os lugares onde você morou:
                    </label>

                    <textarea id="lugares" name="lugares">Poços de caldas MG, Campinas SP, São Paulo Capital</textarea>

                </div>

            </fieldset>


            <button type="submit">Enviar Pesquisa</button>

        </form>

        <footer>
            ©2024 | Formulário HTML – Atividade de Pesquisa de Usuário | José Roberto Bueno ©
        </footer>



    </main>

</body>
</html>
